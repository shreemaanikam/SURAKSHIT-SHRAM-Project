version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surakshit_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=SURAKSHIT SHRAM Backend
      - ENVIRONMENT=production
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=surakshit_user
      - POSTGRES_PASSWORD=surakshit_password
      - POSTGRES_DB=surakshit_shram_db
      - DATABASE_URL=postgresql://surakshit_user:surakshit_password@db:5432/surakshit_shram_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=surakshit-shram-super-secret-jwt-key-2026-production-ready
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage/documents:/app/storage/documents

  db:
    image: postgres:16-alpine
    container_name: surakshit_postgres
    restart: always
    environment:
      - POSTGRES_USER=surakshit_user
      - POSTGRES_PASSWORD=surakshit_password
      - POSTGRES_DB=surakshit_shram_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surakshit_user -d surakshit_shram_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surakshit_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
