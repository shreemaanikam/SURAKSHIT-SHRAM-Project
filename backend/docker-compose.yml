version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surakshit_backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-SURAKSHIT SHRAM Backend}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-surakshit-shram-development-key-change-in-production-12345}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-surakshit_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-surakshit_password_change_me}
      - POSTGRES_DB=${POSTGRES_DB:-surakshit_shram_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-surakshit_user}:${POSTGRES_PASSWORD:-surakshit_password_change_me}@db:5432/${POSTGRES_DB:-surakshit_shram_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-surakshit_redis_pass}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage/documents:/app/storage/documents

  db:
    image: postgres:16-alpine
    container_name: surakshit_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-surakshit_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-surakshit_password_change_me}
      - POSTGRES_DB=${POSTGRES_DB:-surakshit_shram_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surakshit_user} -d ${POSTGRES_DB:-surakshit_shram_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surakshit_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-surakshit_redis_pass}"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-surakshit_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
